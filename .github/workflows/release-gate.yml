name: TDS GA7 Release Gate

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - name: 'TDS identity: 24f2004141@ds.study.iitm.ac.in'
        run: echo "TDS GA7 release gate - 24f2004141@ds.study.iitm.ac.in"

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Test the release-gate implementation
        run: python gates/test_q1.py

      - name: Test the other policy gates
        run: |
          python gates/test_q2.py
          python gates/test_q3.py
          python gates/test_q4.py
          python gates/test_q5.py
